[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kenton-worship-workflow"
version = "0.1.0"
description = "Small, file-based tools for Kenton's weekly worship workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "lxml>=5,<7", "pdfplumber>=0.11,<1", "python-docx>=1.1,<2", "pypdf>=5,<7"]

[project.scripts]
kenton-workflow = "kenton_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
